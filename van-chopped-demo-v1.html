<!DOCTYPE html>
<!--
  Built with project-to-portfolio (Phase 2: demo, not splash — the splash equivalent
  already exists as van-chopped-pitch-v1.html from a prior run).

  Recon: lib/classify-html.js (ported verbatim below — same scoring, same thresholds)
  and public/styles.css (palette + layout tokens reused; markup/JS written fresh). See
  recon.md. The repo's own demo/index.html and the live public/app.js + public/index.html
  were not opened for this build.

  Seeded, no backend, no keys, no network. Opens from file:// with the network off.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Van-Chopped — Demo</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #fbfbfc; --border: #e3e6ea;
    --text: #1c2024; --muted: #6b7280; --accent: #4f46e5; --accent-soft: #eef0fe;
    --doc: #0e7c5a; --doc-bg: #e6f5ef; --emb: #9e5c0c; --emb-bg: #fbf0e0;
    --count-text: #565c66;
    --prompt: #4f46e5; --prompt-bg: #eef0fe; --danger: #c0392b;
    --component: #7c3aed; --component-bg: #f0e9ff;
    --skill: #0369a1; --skill-bg: #e0f2fe;
    --agent: #be185d; --agent-bg: #fce7f3;
    --rule: #57534e; --rule-bg: #ecebe9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --panel: #1d2026; --panel-2: #21242b; --border: #2c313a;
      --text: #e6e8eb; --muted: #9aa2ad; --accent: #8b83ff; --accent-soft: #26243f;
      --doc: #4ade9f; --doc-bg: #123528; --emb: #e0a458; --emb-bg: #3a2c14;
      --count-text: #9aa2ad;
      --prompt: #a5a0ff; --prompt-bg: #26243f;
      --component: #c4b5fd; --component-bg: #2a1f47;
      --skill: #7dd3fc; --skill-bg: #0c2a3f;
      --agent: #f9a8d4; --agent-bg: #3f1229;
      --rule: #d6d3d1; --rule-bg: #2a2724;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--sans); color: var(--text); background: var(--bg); font-size: 14px; overflow-x: hidden; }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  #app { display: grid; grid-template-columns: 220px 300px 1fr; height: 100vh; }

  /* Top strip — demo-artifact packaging identity, not part of the real app UI */
  .demo-strip {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
    padding: 7px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2);
    font-size: 12px; color: var(--muted);
  }
  .demo-strip strong { color: var(--text); }
  .demo-strip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--doc); flex-shrink: 0; }
  .demo-strip a { margin-left: auto; color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }

  /* Sidebar */
  .sidebar { background: var(--panel-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 14px 12px; gap: 4px; overflow-y: auto; }
  .brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .logo { color: var(--accent); font-size: 18px; }
  .group-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 4px 2px; }
  .filter { display: flex; justify-content: space-between; align-items: center; background: none; border: none; color: var(--text); text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 13px; width: 100%; }
  .filter:hover { background: var(--panel); }
  .filter.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .count { background: var(--border); color: var(--count-text); border-radius: 20px; padding: 1px 7px; font-size: 11px; font-weight: 600; }
  .filter.active .count { background: var(--accent); color: #fff; }
  .sidebar-foot { margin-top: auto; padding-top: 10px; font-size: 11px; color: var(--muted); }

  /* List */
  .list-col { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .list-head { padding: 10px; border-bottom: 1px solid var(--border); }
  #search { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  .card { padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .card:hover { background: var(--panel-2); }
  .card.sel { background: var(--accent-soft); border-color: var(--accent); }
  .card-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .card-name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .card-path { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* pills */
  .pill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; flex-shrink: 0; }
  .pill.prompt { background: var(--prompt-bg); color: var(--prompt); }
  .pill.document { background: var(--doc-bg); color: var(--doc); }
  .pill.embedded { background: var(--emb-bg); color: var(--emb); }
  .pill.component { background: var(--component-bg); color: var(--component); }
  .pill.skill { background: var(--skill-bg); color: var(--skill); }
  .pill.agent { background: var(--agent-bg); color: var(--agent); }
  .pill.rule { background: var(--rule-bg); color: var(--rule); }

  /* Detail */
  .detail-col { overflow: hidden; display: flex; flex-direction: column; }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  .empty-mark { font-size: 40px; color: var(--muted); }
  .detail-body { display: flex; flex-direction: column; height: 100%; }
  .detail-head { display: flex; gap: 12px; padding: 16px 18px 6px; align-items: flex-start; }
  .titles { flex: 1; min-width: 0; }
  .detail-head h1 { font-size: 18px; margin: 0; }
  .desc { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .path-row { padding: 0 18px 8px; display: flex; align-items: center; gap: 10px; }
  .path-row code { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }
  .promote-btn { background: var(--panel); border: 1px solid var(--accent); color: var(--accent); font-weight: 600; border-radius: 6px; padding: 4px 10px; font-size: 11px; margin-left: auto; }
  .promote-btn:hover { background: var(--accent-soft); }
  .promote-btn:disabled { opacity: .4; cursor: default; border-color: var(--border); color: var(--muted); }

  .classification { margin: 0 18px 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px; }
  .classification h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .classification ul { margin: 0; padding-left: 16px; color: var(--text); }
  .classification li { margin: 2px 0; }
  .conf { float: right; color: var(--muted); font-weight: 600; }
  .score-note { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }
  .score-note b { color: var(--text); }

  .tabs { display: flex; align-items: center; gap: 4px; padding: 0 14px; border-bottom: 1px solid var(--border); }
  .tab { background: none; border: none; color: var(--muted); padding: 9px 10px; font-size: 13px; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

  .pane { flex: 1; overflow: auto; }
  #srcPane, #fieldsPane { padding: 14px 18px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  #renderedPane { padding: 16px 22px; line-height: 1.6; }
  #renderedPane h1 { font-size: 20px; margin: 0 0 8px; }
  .meta-table { width: calc(100% - 36px); margin: 12px 18px; border-collapse: collapse; font-size: 12px; }
  .meta-table td { border-bottom: 1px solid var(--border); padding: 6px 8px; vertical-align: top; }
  .meta-table td:first-child { font-family: var(--mono); color: var(--muted); width: 140px; word-break: break-all; }

  /* Mobile — same breakpoint + slide pattern as the real app */
  .mobilebar { display: none; }
  .mback { display: none; }
  .backdrop { display: none; }
  .iconbtn { background: none; border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 9px; font-size: 15px; }

  @media (max-width: 820px) {
    #app { grid-template-columns: minmax(0, 1fr); }
    .demo-strip a { display: none; }
    .list-col { min-width: 0; }
    #search { min-width: 0; flex: 1; font-size: 16px; }

    .sidebar { position: fixed; top: 30px; left: 0; bottom: 0; width: 82%; max-width: 300px; z-index: 60; transform: translateX(-100%); transition: transform .22s ease; box-shadow: 0 0 24px rgba(0,0,0,.25); }
    #app.sidebar-open .sidebar { transform: translateX(0); }
    .backdrop { position: fixed; inset: 0; top: 30px; background: rgba(0,0,0,.45); z-index: 50; }
    #app.sidebar-open .backdrop { display: block; }

    .list-col { grid-column: 1; grid-row: 1; }
    .mobilebar { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 20; }
    .mtitle { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }

    .detail-col { position: fixed; inset: 0; top: 30px; z-index: 40; background: var(--panel); transform: translateX(100%); transition: transform .22s ease; }
    #app.detail-open .detail-col { transform: translateX(0); }
    .mback { display: inline-block; background: var(--panel-2); border: 1px solid var(--border); color: var(--accent); border-radius: 8px; padding: 5px 11px; font-size: 13px; font-weight: 600; margin: 10px 0 0 14px; align-self: flex-start; }
    .detail-head { flex-wrap: wrap; }
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 200; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div class="demo-strip">
    <span class="dot"></span>
    <strong>Van-Chopped</strong> — interactive demo, seeded data, no backend, no network
    <a href="https://github.com/urlygurl/van-chopped" target="_blank" rel="noopener">Run the real thing →</a>
  </div>

  <div class="backdrop" onclick="closeSidebar()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">▤</span> Van-Chopped</div>
    <div class="group-label">Type</div>
    <div id="typeFilters"></div>
    <div class="sidebar-foot">14 seeded artifacts · classifier runs live, in your browser</div>
  </nav>

  <section class="list-col">
    <div class="mobilebar">
      <button class="iconbtn" onclick="openSidebar()">☰</button>
      <div class="mtitle">Van-Chopped</div>
    </div>
    <div class="list-head">
      <input id="search" type="text" placeholder="Search seeded artifacts…" oninput="render()">
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <section class="detail-col" id="detailCol">
    <div class="empty" id="emptyState">
      <div class="empty-mark">▤</div>
      <div>Select an artifact</div>
    </div>
    <div class="detail-body hidden" id="detailBody"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Seeded data — real paths from sample-library/, HTML content written to
// genuinely exercise the ported classifier below. ──────────────────────────
const MANIFEST_ROOTS = new Set(['sample-library/my-webapp']);

const ITEMS = [
  { id:'p1', name:'code-review.md', path:'sample-library/prompts/code-review.md', type:'prompt', qualifier:'frontmatter',
    desc:'Prompt with YAML frontmatter for automated PR review comments.',
    fields:{ name:'code-review', model:'claude-sonnet-5', tags:'review, tooling' },
    source:'---\nname: code-review\nmodel: claude-sonnet-5\ntags: [review, tooling]\n---\nReview this diff for correctness bugs...' },
  { id:'p2', name:'meeting-notes.md', path:'sample-library/prompts/meeting-notes.md', type:'prompt', qualifier:'plain',
    desc:'Plain prompt, no frontmatter — summarizes a transcript into action items.',
    source:'Summarize this meeting transcript into decisions and action items, one line each.' },
  { id:'p3', name:'summarize.prompt', path:'sample-library/prompts/summarize.prompt', type:'prompt', qualifier:'plain',
    desc:'.prompt extension — recognized by path, not frontmatter.',
    source:'Summarize the attached document in three bullet points.' },
  { id:'a1', name:'reviewer.md', path:'sample-library/my-webapp/.claude/agents/reviewer.md', type:'agent', tool:'claude',
    desc:'Sub-agent definition inside .claude/agents/ — recognized by folder + tool dotfolder.',
    fields:{ name:'reviewer', tools:'Read, Grep, Bash' },
    source:'---\nname: reviewer\ntools: [Read, Grep, Bash]\n---\nYou review pull requests for correctness...' },
  { id:'s1', name:'pdf-export', path:'sample-library/my-webapp/.claude/skills/pdf-export/SKILL.md', type:'skill', tool:'claude',
    desc:'SKILL.md-based skill folder under .claude/skills/.',
    fields:{ name:'pdf-export' },
    source:'---\nname: pdf-export\ndescription: Export the current document to PDF.\n---\n# pdf-export\n...' },
  { id:'r1', name:'style.mdc', path:'sample-library/my-webapp/.cursor/rules/style.mdc', type:'rule', tool:'cursor',
    desc:'.mdc rule in .cursor/rules/ — tool badge inferred from the dotfolder.',
    source:'# Style\nPrefer named exports. No default exports for components.' },
  { id:'c1', name:'Button.tsx', path:'sample-library/my-webapp/src/Button.tsx', type:'component', qualifier:'tsx',
    desc:'Typed React component.',
    source:'export function Button({ children, onClick }: { children: React.ReactNode; onClick: () => void }) {\n  return <button onClick={onClick}>{children}</button>;\n}' },
  { id:'c2', name:'UserCard.jsx', path:'sample-library/my-webapp/src/UserCard.jsx', type:'component', qualifier:'jsx',
    desc:'Plain JSX component.',
    source:'export function UserCard({ user }) {\n  return <div className="card">{user.name}</div>;\n}' },

  { id:'h1', name:'landing.html', path:'sample-library/sites/landing.html', type:'html',
    desc:'Standalone marketing page — complete document, self-contained styles.',
    source:'<!doctype html>\n<html>\n<head><title>Acme</title><meta name="description" content="Acme ships fast."></head>\n<body>\n<style>body{margin:0;font-family:sans-serif}</style>\n<h1>Acme</h1>\n</body>\n</html>' },
  { id:'h2', name:'q3-report.html', path:'sample-library/reports/q3-report.html', type:'html',
    desc:'A findings report someone dropped as a single HTML file.',
    source:'<!doctype html>\n<html>\n<head><title>Q3 Report</title></head>\n<body>\n<style>.chart{height:200px}</style>\n<h1>Q3 Results</h1>\n</body>\n</html>' },
  { id:'h3', name:'email.html', path:'sample-library/my-webapp/templates/email.html', type:'html',
    desc:'Transactional email template — Handlebars-style placeholders, no <html> wrapper.',
    source:'<div class="footer">{{ unsubscribe_link }}</div>\n<p>Hi {{ name }}, your invoice is ready.</p>' },
  { id:'h4', name:'demo.html', path:'sample-library/my-webapp/vendor/widget/demo.html', type:'html',
    desc:'A vendored third-party widget\'s own demo fragment.',
    source:'<div id="widget-root"></div>\n<script src="widget.bundle.a1b2c3.js"><\/script>' },
  { id:'h5', name:'_card.html', path:'sample-library/my-webapp/views/_card.html', type:'html',
    desc:'An EJS view partial — underscore filename, views/ directory, template syntax.',
    source:'<div class="card">\n  <h3><%= title %></h3>\n  <p><%= body %></p>\n</div>' },
  { id:'h6', name:'index.html', path:'sample-library/my-webapp/dist/index.html', type:'html',
    desc:'Built SPA shell in dist/ — looks like a complete document, still classifies as embedded (see below).',
    source:'<!doctype html>\n<html>\n<head><title>my-webapp</title></head>\n<body>\n<div id="root"></div>\n<script src="/assets/index.a1b2c3d4.js"><\/script>\n</body>\n</html>' },
];

// ── The HTML qualifier — ported from lib/classify-html.js, same scoring,
// same thresholds. Runs live against the seeded content above. ─────────────
const EMBEDDED_DIR_SEGMENTS = new Set([
  'node_modules','bower_components','vendor','vendors','dist','build','out','output',
  '.next','.nuxt','.output','.svelte-kit','.astro','.cache','.parcel-cache','coverage',
  'storybook-static','elm-stuff','__pycache__','site-packages','.venv','venv','env',
  'target','bin','obj','.git','deps','_site','.docusaurus',
]);
const TEMPLATE_DIR_SEGMENTS = new Set([
  'templates','template','partials','partial','views','view','components','layouts',
  'includes','fragments','emails','mail',
]);
const TEMPLATE_SYNTAX = [
  /\{\{[^}]*\}\}/, /\{%[^%]*%\}/, /<%[-=]?[\s\S]*?%>/,
  /@(if|for|foreach|section|extends|include|yield|csrf)\b/, /\bng-[a-z]+=/,
  /\s(v-if|v-for|v-bind|v-model|:class|:style|@click)=/, /\bx-data=/, /\bth:[a-z]+=/,
  /\{#[\s\S]*?#\}/,
];

function nearestManifestDir(filePath) {
  const parts = filePath.split('/'); parts.pop();
  for (let i = parts.length; i > 0; i--) {
    const dir = parts.slice(0, i).join('/');
    if (MANIFEST_ROOTS.has(dir)) return dir;
  }
  return null;
}

function classifyHtml({ filePath, content }) {
  const reasons = [];
  let score = 0;
  const segments = filePath.split('/');
  const lower = content.toLowerCase();

  const hitDir = segments.find((s) => EMBEDDED_DIR_SEGMENTS.has(s));
  if (hitDir) { score += 5; reasons.push(`inside "${hitDir}/" (generated/vendored directory)`); }

  const templateDir = segments.find((s) => TEMPLATE_DIR_SEGMENTS.has(s.toLowerCase()));
  if (templateDir) { score += 2; reasons.push(`inside "${templateDir}/" (app template/view directory)`); }

  const projectDir = nearestManifestDir(filePath);
  if (projectDir) { score += 2; reasons.push(`within a software project (manifest in "${projectDir.split('/').pop()}/")`); }

  const base = segments[segments.length - 1].toLowerCase();
  if (base.startsWith('_') || /\.(partial|template|tmpl|fragment|component)\.html?$/.test(base)) {
    score += 2; reasons.push('filename marks it as a partial/template');
  }

  const hasDoctype = /<!doctype\s+html/i.test(content);
  const hasHtmlTag = /<html[\s>]/i.test(lower);
  const hasHead = /<head[\s>]/i.test(lower);
  const hasBody = /<body[\s>]/i.test(lower);

  if (!hasHtmlTag && !hasDoctype) { score += 4; reasons.push('no <html>/<!doctype> — looks like a fragment/partial'); }
  else if (hasDoctype && hasHtmlTag && hasHead && hasBody) { score -= 4; reasons.push('complete standalone document (<!doctype>+<html>+<head>+<body>)'); }

  const templateHit = TEMPLATE_SYNTAX.find((re) => re.test(content));
  if (templateHit) { score += 4; reasons.push('contains server/framework templating syntax'); }

  if (/<div\s+id=["'](root|app|__next|___gatsby)["']/i.test(content) &&
      /<script[^>]+src=["'][^"']*\.(?:[a-f0-9]{6,}|chunk|bundle)[^"']*\.js/i.test(content)) {
    score += 3; reasons.push('SPA mount point + hashed JS bundle (app shell)');
  }

  const hasTitle = /<title[\s>]/i.test(lower);
  const hasMetaDesc = /<meta[^>]+name=["']description["']/i.test(content);
  if (hasTitle) { score -= 1; reasons.push('has <title>'); }
  if (hasMetaDesc) { score -= 1; reasons.push('has meta description'); }

  if ((hasDoctype || hasHtmlTag) && !/<script[^>]+src=/i.test(content) && /<style[\s>]/i.test(lower)) {
    score -= 1; reasons.push('self-contained (inline styles, no external scripts)');
  }

  const cls = score >= 2 ? 'embedded' : 'document';
  const confidence = Math.min(1, 0.5 + Math.abs(score - 1.5) / 8);
  return { class: cls, confidence: Math.round(confidence * 100) / 100, reasons, score };
}

// Pre-compute classification for every html item once.
ITEMS.forEach((it) => { if (it.type === 'html') it.classification = classifyHtml({ filePath: it.path, content: it.source }); });

// ── UI state ────────────────────────────────────────────────────────────
const PRODUCT_SLUG = 'van-chopped-demo-live';
const LS = (k) => `${PRODUCT_SLUG}:${k}`;
let activeType = localStorage.getItem(LS('type')) || 'all';
let selectedId = null;
let activeTab = 'source';
const promoted = new Set();

const TYPE_LABELS = { all:'All', prompt:'Prompts', html:'HTML', component:'Components', skill:'Skills', agent:'Agents', rule:'Rules' };

function counts() {
  const c = { all: ITEMS.length };
  ITEMS.forEach((it) => { c[it.type] = (c[it.type] || 0) + 1; });
  return c;
}

function renderFilters() {
  const c = counts();
  const el = document.getElementById('typeFilters');
  el.innerHTML = '';
  ['all','prompt','html','component','skill','agent','rule'].forEach((t) => {
    if (!c[t]) return;
    const b = document.createElement('button');
    b.className = 'filter' + (activeType === t ? ' active' : '');
    b.innerHTML = `<span>${TYPE_LABELS[t]}</span><span class="count">${c[t]}</span>`;
    b.onclick = () => { activeType = t; localStorage.setItem(LS('type'), t); closeSidebar(); render(); };
    el.appendChild(b);
  });
}

function classPill(it) {
  const cls = it.type === 'html' ? it.classification.class : (it.qualifier === 'tsx' || it.qualifier === 'jsx' ? it.type : it.type);
  return `<span class="pill ${it.type === 'html' ? it.classification.class : it.type}">${it.type === 'html' ? it.classification.class : it.type}</span>`;
}

function render() {
  renderFilters();
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('list');
  list.innerHTML = '';
  const filtered = ITEMS.filter((it) => (activeType === 'all' || it.type === activeType) &&
    (!q || it.name.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q)));
  filtered.forEach((it) => {
    const li = document.createElement('li');
    li.className = 'card' + (selectedId === it.id ? ' sel' : '');
    li.innerHTML = `<div class="card-top">${classPill(it)}<span class="card-name">${it.name}</span></div><div class="card-path">${it.path}</div>`;
    li.onclick = () => selectItem(it.id);
    list.appendChild(li);
  });
  if (!filtered.length) {
    list.innerHTML = '<div class="muted-note" style="padding:16px;color:var(--muted);font-size:12px">No seeded artifacts match.</div>';
  }
}

function selectItem(id) {
  selectedId = id;
  activeTab = 'source';
  document.getElementById('app').classList.add('detail-open');
  render();
  renderDetail();
}

function closeDetail() { document.getElementById('app').classList.remove('detail-open'); }
function openSidebar() { document.getElementById('app').classList.add('sidebar-open'); }
function closeSidebar() { document.getElementById('app').classList.remove('sidebar-open'); }

function renderDetail() {
  const it = ITEMS.find((x) => x.id === selectedId);
  const empty = document.getElementById('emptyState');
  const body = document.getElementById('detailBody');
  if (!it) { empty.classList.remove('hidden'); body.classList.add('hidden'); return; }
  empty.classList.add('hidden');
  body.classList.remove('hidden');

  const isHtml = it.type === 'html';
  const cls = isHtml ? it.classification : null;
  const editable = !isHtml || cls.class === 'document' || promoted.has(it.id);

  const tabsHtml = `
    <button class="tab ${activeTab === 'source' ? 'active' : ''}" onclick="setTab('source')">Source</button>
    ${isHtml ? `<button class="tab ${activeTab === 'preview' ? 'active' : ''}" onclick="setTab('preview')">Preview</button>` : `<button class="tab ${activeTab === 'rendered' ? 'active' : ''}" onclick="setTab('rendered')">Rendered</button>`}
    ${it.fields ? `<button class="tab ${activeTab === 'fields' ? 'active' : ''}" onclick="setTab('fields')">Fields</button>` : ''}
    <button class="tab ${activeTab === 'meta' ? 'active' : ''}" onclick="setTab('meta')">Meta</button>
  `;

  let paneHtml = '';
  if (activeTab === 'source') {
    paneHtml = `<div id="srcPane">${escapeHtml(it.source)}</div>`;
  } else if (activeTab === 'preview') {
    paneHtml = `<div id="renderedPane"><div class="muted-note">Sandboxed preview — this seeded fragment rendered as-is:</div><div style="margin-top:10px;border:1px solid var(--border);border-radius:8px;padding:14px;background:#fff;color:#111">${it.source.replace(/<script[\s\S]*?<\/script>/gi,'<!-- script stripped in this static preview -->')}</div></div>`;
  } else if (activeTab === 'rendered') {
    paneHtml = `<div id="renderedPane"><h1>${it.name}</h1><p>${it.desc}</p></div>`;
  } else if (activeTab === 'fields') {
    const rows = Object.entries(it.fields || {}).map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
    paneHtml = `<table class="meta-table">${rows}</table>`;
  } else if (activeTab === 'meta') {
    const rows = [
      ['path', it.path], ['type', it.type], it.qualifier ? ['qualifier', it.qualifier] : null,
      it.tool ? ['tool', it.tool] : null, isHtml ? ['class', cls.class] : null,
      isHtml ? ['confidence', cls.confidence] : null, ['editable', String(editable)],
    ].filter(Boolean).map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
    paneHtml = `<table class="meta-table">${rows}</table>`;
  }

  const classificationHtml = isHtml ? `
    <div class="classification">
      <h4>Classification <span class="conf">${Math.round(cls.confidence * 100)}% confidence</span></h4>
      <ul>${cls.reasons.map((r) => `<li>${escapeHtml(r)}</li>`).join('')}</ul>
      <div class="score-note">raw score <b>${cls.score}</b> — <code>score ≥ 2 → embedded</code>, computed live by the qualifier above, not a canned number.</div>
    </div>` : '';

  body.innerHTML = `
    <div class="mback" onclick="closeDetail()">← Back</div>
    <div class="detail-head">
      <div class="titles">
        <h1>${it.name}</h1>
        <p class="desc">${it.desc}</p>
        <div class="badges">${classPill(it)}${it.tool ? `<span class="pill" style="background:var(--panel-2);color:var(--muted)">${it.tool}</span>` : ''}${promoted.has(it.id) ? '<span class="pill document">promoted</span>' : ''}</div>
      </div>
    </div>
    <div class="path-row">
      <code>${it.path}</code>
      ${isHtml && cls.class === 'embedded' ? `<button class="promote-btn" id="promoteBtn" onclick="promote('${it.id}')" ${promoted.has(it.id) ? 'disabled' : ''}>${promoted.has(it.id) ? 'Promoted' : 'Promote → editable document'}</button>` : ''}
    </div>
    ${classificationHtml}
    <div class="tabs">${tabsHtml}</div>
    <div class="pane">${paneHtml}</div>
  `;
}

function setTab(t) { activeTab = t; renderDetail(); }

function promote(id) {
  promoted.add(id);
  showToast('Copied to documents/ as an editable standalone file — original left untouched. (Demo: nothing written to disk.)');
  renderDetail();
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove('show'), 3200);
}

render();
</script>
</body>
</html>
